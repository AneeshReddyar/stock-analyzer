# ===== application.properties =====
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/revstox_db
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Alternative: H2 Database for testing
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Application Configuration
server.port=8080
spring.application.name=RevStox Stock Analyzer

# Logging Configuration
logging.level.com.revstox.stock_analyzer=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/revstox.log

# CSV Data Configuration
app.csv.file.path=data/stock_data.csv
app.batch.size=1000

# ===== queries.properties =====
# Daily Price Queries
query.dailyprice.insert=INSERT INTO daily_prices (trade_date, symbol, series, prev_close, open_price, high_price, low_price, last_price, close_price, vwap, volume, turnover, trades, deliverable_volume, deliverable_percent) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

query.dailyprice.findBySymbol=SELECT * FROM daily_prices WHERE symbol = ? ORDER BY trade_date DESC

query.dailyprice.findBySymbolAndDateRange=SELECT * FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ? ORDER BY trade_date DESC

query.dailyprice.findAll=SELECT * FROM daily_prices ORDER BY trade_date DESC LIMIT 1000

# Stock Queries
query.stock.insert=INSERT INTO stocks (symbol, company_name, series) VALUES (?, ?, ?) ON DUPLICATE KEY UPDATE company_name = VALUES(company_name), series = VALUES(series)

query.stock.findBySymbol=SELECT * FROM stocks WHERE symbol = ?

query.stock.findAll=SELECT * FROM stocks ORDER BY symbol

# Analytics Queries - Price Analysis
query.analytics.calculateVolatility=SELECT symbol, trade_date, ((high_price - low_price) / open_price * 100) as volatility FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ?

query.analytics.calculatePriceChange=SELECT symbol, trade_date, ((close_price - open_price) / open_price * 100) as price_change FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ?

query.analytics.calculateMovingAverage7=SELECT symbol, trade_date, AVG(close_price) OVER (PARTITION BY symbol ORDER BY trade_date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) as moving_avg_7 FROM daily_prices WHERE symbol = ? ORDER BY trade_date

query.analytics.calculateMovingAverage30=SELECT symbol, trade_date, AVG(close_price) OVER (PARTITION BY symbol ORDER BY trade_date ROWS BETWEEN 29 PRECEDING AND CURRENT ROW) as moving_avg_30 FROM daily_prices WHERE symbol = ? ORDER BY trade_date

# Analytics Queries - Volume Analysis
query.analytics.calculateVWAP=SELECT symbol, trade_date, SUM(close_price * volume) / SUM(volume) as vwap FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ? GROUP BY symbol, trade_date

query.analytics.calculateDailyTurnover=SELECT symbol, trade_date, (close_price * volume) as daily_turnover FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ?

query.analytics.volumeAnalysis=SELECT symbol, trade_date, volume, deliverable_volume, deliverable_percent, (deliverable_volume * 100.0 / volume) as liquidity_ratio FROM daily_prices WHERE symbol = ? ORDER BY trade_date DESC

# Price Gap Analysis
query.analytics.priceGaps=SELECT dp1.symbol, dp1.trade_date, (dp1.open_price - dp2.close_price) as price_gap FROM daily_prices dp1 JOIN daily_prices dp2 ON dp1.symbol = dp2.symbol AND dp1.trade_date = DATE_ADD(dp2.trade_date, INTERVAL 1 DAY) WHERE dp1.symbol = ? ORDER BY dp1.trade_date DESC

# Comparative Analysis
query.analytics.compareStocks=SELECT symbol, AVG(volume) as avg_volume, AVG((high_price - low_price) / open_price * 100) as avg_volatility, AVG((close_price - open_price) / open_price * 100) as avg_price_change FROM daily_prices WHERE symbol IN (%s) AND trade_date BETWEEN ? AND ? GROUP BY symbol

query.analytics.rankByVolume=SELECT symbol, SUM(volume) as total_volume FROM daily_prices WHERE trade_date BETWEEN ? AND ? GROUP BY symbol ORDER BY total_volume DESC LIMIT ?

query.analytics.rankByVolatility=SELECT symbol, AVG((high_price - low_price) / open_price * 100) as avg_volatility FROM daily_prices WHERE trade_date BETWEEN ? AND ? GROUP BY symbol ORDER BY avg_volatility DESC LIMIT ?