# ===== application.properties =====
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/revstox_db
spring.datasource.username=revuser
spring.datasource.password=revpass123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Alternative: H2 Database for testing
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.h2.console.enabled=true

# Schema Initialization - Auto-create tables on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.continue-on-error=false

# JPA/Hibernate Configuration
# Changed from create-drop to validate since we're managing schema manually
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Application Configuration
server.port=8080
spring.application.name=RevStox Stock Analyzer

# Logging Configuration
logging.level.com.revstox.stock_analyzer=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/revstox.log

# CSV Data Configuration
app.csv.file.path=data/stock_data.csv
app.batch.size=1000

# Additional Database Configuration for better performance
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000