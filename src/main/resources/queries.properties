# Additional Analytics Queries

# Price Gap Analysis
query.analytics.priceGapsDetailed=SELECT dp1.symbol, dp1.trade_date, dp1.open_price, dp2.close_price, (dp1.open_price - dp2.close_price) as price_gap, ((dp1.open_price - dp2.close_price) / dp2.close_price * 100) as gap_percentage FROM daily_prices dp1 JOIN daily_prices dp2 ON dp1.symbol = dp2.symbol AND dp1.trade_date = DATE_ADD(dp2.trade_date, INTERVAL 1 DAY) WHERE dp1.symbol = ? AND dp1.trade_date BETWEEN ? AND ? ORDER BY ABS(dp1.open_price - dp2.close_price) DESC

# Volume Correlation Analysis
query.analytics.volumePriceCorrelation=SELECT symbol, trade_date, volume, (close_price - open_price) as price_change, ((close_price - open_price) / open_price * 100) as price_change_percent FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ? ORDER BY volume DESC

# Technical Indicators
query.analytics.rsi=SELECT symbol, trade_date, close_price, LAG(close_price, 1) OVER (PARTITION BY symbol ORDER BY trade_date) as prev_close FROM daily_prices WHERE symbol = ? ORDER BY trade_date

query.analytics.bollinger=SELECT symbol, trade_date, close_price, AVG(close_price) OVER (PARTITION BY symbol ORDER BY trade_date ROWS BETWEEN 19 PRECEDING AND CURRENT ROW) as sma_20, STDDEV(close_price) OVER (PARTITION BY symbol ORDER BY trade_date ROWS BETWEEN 19 PRECEDING AND CURRENT ROW) as std_dev FROM daily_prices WHERE symbol = ? ORDER BY trade_date

# Performance Rankings
query.analytics.topPerformers=SELECT symbol, ((MAX(close_price) - MIN(close_price)) / MIN(close_price) * 100) as price_appreciation, AVG(volume) as avg_volume, COUNT(*) as trading_days FROM daily_prices WHERE trade_date BETWEEN ? AND ? GROUP BY symbol HAVING COUNT(*) >= ? ORDER BY price_appreciation DESC LIMIT ?

query.analytics.worstPerformers=SELECT symbol, ((MAX(close_price) - MIN(close_price)) / MIN(close_price) * 100) as price_appreciation, AVG(volume) as avg_volume, COUNT(*) as trading_days FROM daily_prices WHERE trade_date BETWEEN ? AND ? GROUP BY symbol HAVING COUNT(*) >= ? ORDER BY price_appreciation ASC LIMIT ?

# Sector Analysis (when sector data is available)
query.analytics.sectorPerformance=SELECT s.sector, AVG(((dp.close_price - dp.open_price) / dp.open_price * 100)) as avg_daily_return, AVG(dp.volume) as avg_volume, COUNT(DISTINCT dp.symbol) as stock_count FROM daily_prices dp JOIN stocks s ON dp.symbol = s.symbol WHERE dp.trade_date BETWEEN ? AND ? AND s.sector IS NOT NULL GROUP BY s.sector ORDER BY avg_daily_return DESC
