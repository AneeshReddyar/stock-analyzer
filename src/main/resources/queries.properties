# ===== queries.properties =====
# Daily Price Queries
query.dailyprice.insert=INSERT INTO daily_prices (trade_date, symbol, series, prev_close, open_price, high_price, low_price, last_price, close_price, vwap, volume, turnover, trades, deliverable_volume, deliverable_percent) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

query.dailyprice.findBySymbol=SELECT * FROM daily_prices WHERE symbol = ? ORDER BY trade_date DESC

query.dailyprice.findBySymbolAndDateRange=SELECT * FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ? ORDER BY trade_date DESC

query.dailyprice.findAll=SELECT * FROM daily_prices ORDER BY trade_date DESC LIMIT 1000

# Stock Queries
query.stock.insert=INSERT INTO stocks (symbol, company_name, series) VALUES (?, ?, ?) ON DUPLICATE KEY UPDATE company_name = VALUES(company_name), series = VALUES(series)

query.stock.findBySymbol=SELECT * FROM stocks WHERE symbol = ?

query.stock.findAll=SELECT * FROM stocks ORDER BY symbol

# Analytics Queries - Price Analysis
query.analytics.calculateVolatility=SELECT symbol, trade_date, ((high_price - low_price) / NULLIF(open_price, 0) * 100) as volatility FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ? AND open_price > 0

query.analytics.calculatePriceChange=SELECT symbol, trade_date, ((close_price - open_price) / NULLIF(open_price, 0) * 100) as price_change FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ? AND open_price > 0

query.analytics.calculateMovingAverage7=SELECT symbol, trade_date, AVG(close_price) OVER (PARTITION BY symbol ORDER BY trade_date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) as moving_avg_7 FROM daily_prices WHERE symbol = ? ORDER BY trade_date

query.analytics.calculateMovingAverage30=SELECT symbol, trade_date, AVG(close_price) OVER (PARTITION BY symbol ORDER BY trade_date ROWS BETWEEN 29 PRECEDING AND CURRENT ROW) as moving_avg_30 FROM daily_prices WHERE symbol = ? ORDER BY trade_date

query.analytics.calculateMovingAverage90=SELECT symbol, trade_date, AVG(close_price) OVER (PARTITION BY symbol ORDER BY trade_date ROWS BETWEEN 89 PRECEDING AND CURRENT ROW) as moving_avg_90 FROM daily_prices WHERE symbol = ? ORDER BY trade_date

# Analytics Queries - Volume Analysis
query.analytics.calculateVWAP=SELECT symbol, trade_date, SUM(close_price * volume) / NULLIF(SUM(volume), 0) as vwap FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ? AND volume > 0 GROUP BY symbol, trade_date

query.analytics.calculateDailyTurnover=SELECT symbol, trade_date, (close_price * volume) as daily_turnover FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ?

query.analytics.volumeAnalysis=SELECT symbol, trade_date, volume, deliverable_volume, deliverable_percent, (deliverable_volume * 100.0 / NULLIF(volume, 0)) as liquidity_ratio FROM daily_prices WHERE symbol = ? AND volume > 0 ORDER BY trade_date DESC

# Price Gap Analysis with NULL handling
query.analytics.priceGaps=SELECT dp1.symbol, dp1.trade_date, (dp1.open_price - dp2.close_price) as price_gap, ((dp1.open_price - dp2.close_price) / NULLIF(dp2.close_price, 0) * 100) as gap_percentage FROM daily_prices dp1 JOIN daily_prices dp2 ON dp1.symbol = dp2.symbol AND dp1.trade_date = DATE_ADD(dp2.trade_date, INTERVAL 1 DAY) WHERE dp1.symbol = ? AND dp2.close_price > 0 ORDER BY dp1.trade_date DESC

# Comparative Analysis
query.analytics.compareStocks=SELECT symbol, AVG(volume) as avg_volume, AVG((high_price - low_price) / NULLIF(open_price, 0) * 100) as avg_volatility, AVG((close_price - open_price) / NULLIF(open_price, 0) * 100) as avg_price_change FROM daily_prices WHERE symbol IN (%s) AND trade_date BETWEEN ? AND ? AND open_price > 0 GROUP BY symbol

query.analytics.rankByVolume=SELECT symbol, SUM(volume) as total_volume, AVG(volume) as avg_volume FROM daily_prices WHERE trade_date BETWEEN ? AND ? GROUP BY symbol ORDER BY total_volume DESC LIMIT ?

query.analytics.rankByVolatility=SELECT symbol, AVG((high_price - low_price) / NULLIF(open_price, 0) * 100) as avg_volatility FROM daily_prices WHERE trade_date BETWEEN ? AND ? AND open_price > 0 GROUP BY symbol ORDER BY avg_volatility DESC LIMIT ?

# Additional Enhanced Queries
query.analytics.priceGapsDetailed=SELECT dp1.symbol, dp1.trade_date, dp1.open_price, dp2.close_price, (dp1.open_price - dp2.close_price) as price_gap, ((dp1.open_price - dp2.close_price) / NULLIF(dp2.close_price, 0) * 100) as gap_percentage FROM daily_prices dp1 JOIN daily_prices dp2 ON dp1.symbol = dp2.symbol AND dp1.trade_date = DATE_ADD(dp2.trade_date, INTERVAL 1 DAY) WHERE dp1.symbol = ? AND dp1.trade_date BETWEEN ? AND ? AND dp2.close_price > 0 ORDER BY ABS(dp1.open_price - dp2.close_price) DESC

query.analytics.volumePriceCorrelation=SELECT symbol, trade_date, volume, (close_price - open_price) as price_change, ((close_price - open_price) / NULLIF(open_price, 0) * 100) as price_change_percent FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ? AND open_price > 0 ORDER BY volume DESC

query.analytics.topPerformers=SELECT symbol, ((MAX(close_price) - MIN(close_price)) / NULLIF(MIN(close_price), 0) * 100) as price_appreciation, AVG(volume) as avg_volume, COUNT(*) as trading_days FROM daily_prices WHERE trade_date BETWEEN ? AND ? GROUP BY symbol HAVING COUNT(*) >= ? AND MIN(close_price) > 0 ORDER BY price_appreciation DESC LIMIT ?

query.analytics.worstPerformers=SELECT symbol, ((MAX(close_price) - MIN(close_price)) / NULLIF(MIN(close_price), 0) * 100) as price_appreciation, AVG(volume) as avg_volume, COUNT(*) as trading_days FROM daily_prices WHERE trade_date BETWEEN ? AND ? GROUP BY symbol HAVING COUNT(*) >= ? AND MIN(close_price) > 0 ORDER BY price_appreciation ASC LIMIT ?

query.analytics.sectorPerformance=SELECT s.sector, AVG(((dp.close_price - dp.open_price) / NULLIF(dp.open_price, 0) * 100)) as avg_daily_return, AVG(dp.volume) as avg_volume, COUNT(DISTINCT dp.symbol) as stock_count FROM daily_prices dp JOIN stocks s ON dp.symbol = s.symbol WHERE dp.trade_date BETWEEN ? AND ? AND s.sector IS NOT NULL AND dp.open_price > 0 GROUP BY s.sector ORDER BY avg_daily_return DESC

# Volume Statistics
query.analytics.volumeStatistics=SELECT symbol, AVG(volume) as avg_volume, MAX(volume) as max_volume, MIN(volume) as min_volume, SUM(volume) as total_volume, AVG(turnover) as avg_turnover, MAX(turnover) as max_turnover, MIN(turnover) as min_turnover, SUM(turnover) as total_turnover, AVG(deliverable_percent) as avg_deliverable_percent FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ? GROUP BY symbol

# VWAP Calculation with better handling
query.analytics.vwapPeriod=SELECT SUM(close_price * volume) / NULLIF(SUM(volume), 0) as vwap FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ? AND volume > 0

# Average Volume
query.analytics.averageVolume=SELECT AVG(volume) as avg_volume FROM daily_prices WHERE symbol = ? AND trade_date BETWEEN ? AND ?

# Top Volume Stocks
query.analytics.topVolumeStocks=SELECT symbol, SUM(volume) as total_volume, AVG(volume) as avg_volume FROM daily_prices WHERE trade_date BETWEEN ? AND ? GROUP BY symbol ORDER BY total_volume DESC LIMIT ?